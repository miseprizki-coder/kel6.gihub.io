<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Presentasi PowerPoint</title>
    
    <!-- Tambahan Baru: Menghubungkan file CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container Utama -->
    <main id="main-container" class="main-container">

        <!-- Header -->
        <header id="page-header" class="page-header">
            <h1 id="main-title" class="main-title">
                Generator Presentasi PowerPoint
            </h1>
            <p id="main-description" class="main-description">
                Buat media pembelajaran presentasi secara otomatis dengan mudah
            </p>
        </header>

        <!-- Section Pilihan Jenjang -->
        <section id="education-level-section" class="education-level-section">
            <h2 class="section-title">Pilih Jenjang</h2>

            <div id="education-level-container" class="education-level-container">
                <label for="education-level" class="input-label">
                    Jenjang Pendidikan
                </label>

                <select id="education-level" class="education-level-select" name="education_level">
                    <option value="">-- Pilih Jenjang --</option>
                    <option value="smp">SMP</option>
                    <option value="sma">SMA</option>
                    <option value="kuliah">Kuliah</option>
                    <option value="pekerjaan">Pekerjaan</option>
                </select>
            </div>
        </section>

        <!-- Section Input Materi -->
        <section id="slides-section" class="slides-section">
            <h2 class="section-title">Input Materi Presentasi</h2>

            <!-- Container Semua Slide -->
            <div id="slides-container" class="slides-container">

                <!-- Slide 1 -->
                <article id="slide-1" class="slide-card">
                    <h3 class="slide-title">Slide 1</h3>

                    <!-- Input Judul Materi -->
                    <div class="form-group">
                        <label for="slide-title-1" class="input-label">
                            Judul Materi
                        </label>
                        <input 
                            type="text"
                            id="slide-title-1"
                            class="slide-title-input"
                            name="slide_title_1"
                            placeholder="Masukkan judul materi"
                        >
                    </div>

                    <!-- Input Isi Materi -->
                    <div class="form-group">
                        <label for="slide-content-1" class="input-label">
                            Isi Materi
                        </label>
                        <textarea
                            id="slide-content-1"
                            class="slide-content-textarea"
                            name="slide_content_1"
                            rows="6"
                            placeholder="Masukkan isi materi"
                        ></textarea>
                    </div>
                </article>

            </div>

            <!-- Tombol Tambah Halaman -->
            <div id="add-slide-button-container" class="add-slide-button-container">
                <button
                    type="button"
                    id="add-slide-button"
                    class="add-slide-button"
                >
                    Tambah Halaman
                </button>
            </div>
        </section>

        <!-- Section Generate Presentasi -->
        <section id="generate-presentation-section" class="generate-presentation-section">
            <button
                type="submit"
                id="generate-presentation-button"
                class="generate-presentation-button"
            >
                Buat Presentasi
            </button>
        </section>

    </main>
    <!-- Tambahkan 2 baris ini untuk memanggil PptxGenJS -->
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/libs/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
   
    <!-- Tambahan Baru: Menghubungkan file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
