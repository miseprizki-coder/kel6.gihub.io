<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Presentasi PowerPoint</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="main-container" class="main-container">

        <header id="page-header" class="page-header">
            <h1 id="main-title" class="main-title">
                Generator Presentasi PowerPoint
            </h1>
            <p id="main-description" class="main-description">
                Buat media pembelajaran presentasi secara otomatis dengan mudah
            </p>
        </header>

        <section id="cover-section" class="slides-section">
            <h2 class="section-title">Data Halaman Sampul (Cover)</h2>
            
            <article class="slide-card" style="border-left: 4px solid #1E293B;">
                <div class="form-group">
                    <label for="cover-title" class="input-label">Judul Materi Keseluruhan</label>
                    <input type="text" id="cover-title" class="slide-title-input" placeholder="Contoh: Pancasila Sebagai Ideologi Negara">
                </div>

                <div class="form-group">
                    <label for="cover-course" class="input-label">Mata Kuliah / Dosen Pengampu</label>
                    <input type="text" id="cover-course" class="slide-title-input" placeholder="Contoh: Pendidikan Kewarganegaraan / Bpk. Budi">
                </div>

                <div class="form-group">
                    <label for="cover-members" class="input-label">Nama Kelompok & Anggota</label>
                    <textarea id="cover-members" class="slide-content-textarea" rows="4" placeholder="Contoh:&#10;Kelompok 6:&#10;1. Andi&#10;2. Budi"></textarea>
                </div>
            </article>
        </section>

        <section id="slides-section" class="slides-section">
            <h2 class="section-title">Input Materi Presentasi</h2>

            <div id="slides-container" class="slides-container">

                <article id="slide-1" class="slide-card">
                    <h3 class="slide-title">Slide 1</h3>

                    <div class="form-group">
                        <label for="slide-title-1" class="input-label">
                            Judul Materi
                        </label>
                        <input 
                            type="text"
                            id="slide-title-1"
                            class="slide-title-input"
                            name="slide_title_1"
                            placeholder="Masukkan judul materi"
                        >
                    </div>

                    <div class="form-group">
                        <label for="slide-content-1" class="input-label">
                            Isi Materi
                        </label>
                        <textarea
                            id="slide-content-1"
                            class="slide-content-textarea"
                            name="slide_content_1"
                            rows="6"
                            placeholder="Masukkan isi materi"
                        ></textarea>
                    </div>
                </article>

            </div>

            <div id="add-slide-button-container" class="add-slide-button-container">
                <button
                    type="button"
                    id="add-slide-button"
                    class="add-slide-button"
                >
                    Tambah Halaman
                </button>
            </div>
        </section>

        <section id="generate-presentation-section" class="generate-presentation-section">
            <button
                type="submit"
                id="generate-presentation-button"
                class="generate-presentation-button"
            >
                Buat Presentasi
            </button>
        </section>

    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/libs/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
